
# Added automatically by Workbench for Zephyr
#--- DEBUG PRESET - BEGIN ---#
# Set to -Og
CONFIG_DEBUG_OPTIMIZATIONS=y
# Thread awareness support
CONFIG_DEBUG_THREAD_INFO=y
# Generate stack usage per-function
CONFIG_STACK_USAGE=y
# Other options in case not set by default
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BUILD_OUTPUT_META=y
CONFIG_OUTPUT_SYMBOLS=y
CONFIG_OUTPUT_STAT=y
CONFIG_OUTPUT_DISASSEMBLY=y
CONFIG_OUTPUT_PRINT_MEMORY_USAGE=y
#--- DEBUG PRESET - END ---#

# ---------------------------------------------------------------------------
# Network / PPP / modem transport
# ---------------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_L2_PPP=y
CONFIG_NET_L2_PPP_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"
CONFIG_NET_INTERFACE_NAME=y

CONFIG_MODEM=y
CONFIG_MODEM_CELLULAR=y
CONFIG_MODEM_CELLULAR_APN="internet"
CONFIG_MODEM_CELLULAR_PERIODIC_SCRIPT_MS=10000
CONFIG_MODEM_CELLULAR_MAX_SCRIPT_FAILURES=8
CONFIG_MODEM_CELLULAR_UART_BUFFER_SIZES=1024
CONFIG_MODEM_CELLULAR_CHAT_BUFFER_SIZE=256
CONFIG_MODEM_CMUX_WORK_BUFFER_SIZE_EXTRA=512
CONFIG_MODEM_AT_USER_PIPE=y
CONFIG_MODEM_AT_USER_PIPE_IDX=0
CONFIG_PM_DEVICE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_ENTROPY_STM32_RNG=y

# Keep the known-stable UART backend selection on Zephyr main.
CONFIG_MODEM_BACKEND_UART_ISR=y
CONFIG_MODEM_BACKEND_UART_ASYNC=n

# ---------------------------------------------------------------------------
# Logging / timestamp / diagnostics
# ---------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_TIMESTAMP=y
CONFIG_LOG_OUTPUT_FORMAT_CUSTOM_TIMESTAMP=y
CONFIG_PRINTK=y

# ---------------------------------------------------------------------------
# MQTT / TLS / certificate validation
# ---------------------------------------------------------------------------
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=60000
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_NET_LOG=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_SNTP=y

# ---------------------------------------------------------------------------
# Modem debug policy (keep focused during bring-up)
# ---------------------------------------------------------------------------
CONFIG_MODEM_LOG_LEVEL_DBG=y
CONFIG_MODEM_MODULES_LOG_LEVEL_DBG=n
CONFIG_MODEM_CHAT_LOG_RAW_RX=n
CONFIG_MODEM_CHAT_LOG_BUFFER_SIZE=256

# ---------------------------------------------------------------------------
# Application policy defaults
# ---------------------------------------------------------------------------
CONFIG_APP_MQTT_USE_TLS=y
CONFIG_APP_MQTT_PORT="8883"
CONFIG_APP_MQTT_PUBLISH_COUNT=10
CONFIG_APP_MQTT_RX_BUF_SIZE=1024
CONFIG_APP_MQTT_TX_BUF_SIZE=1024
CONFIG_APP_MQTT_PAYLOAD_BUF_SIZE=256
# Verify broker certificate (one-way TLS)
CONFIG_APP_MQTT_TLS_VERIFY_PEER=y
# Require client certificate and key (mutual TLS)
CONFIG_APP_MQTT_TLS_MUTUAL_AUTH=y
